name: Tremu Retro Call APK
on:
  workflow_dispatch:
  push:
    branches: [master, main, tremu-retrocall-build]
    paths: ['TremuRetroCall/**', '.github/workflows/android.yml', 'app/**', 'build.gradle', 'settings.gradle']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Configure Gradle
        run: |
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo /tmp/gradle-8.10.2/bin >> "$GITHUB_PATH"
          fi
      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon :app:assembleDebug; else gradle --no-daemon :app:assembleDebug; fi
      - name: Certificate fingerprint
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | grep -E 'SHA1:|SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: TremuRetroCall-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
