name: Tremu Retro Call APK
on:
  workflow_dispatch:
  push:
    branches: [master, main, tremu-retrocall-build]
    paths: ['TremuRetroCall/**', '.github/workflows/android.yml', 'app/**', 'build.gradle', 'settings.gradle']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK components
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        run: |
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo /tmp/gradle-8.10.2/bin >> "$GITHUB_PATH"
          fi
      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon :app:assembleDebug; else gradle --no-daemon :app:assembleDebug; fi
      - name: Certificate fingerprint
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TremuRetroCall-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
